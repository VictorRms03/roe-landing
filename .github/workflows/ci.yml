name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No NEXT_PUBLIC_SITE_URL here on purpose: src/lib/site.ts falls back to
      # the production URL, and CI only needs to prove the build compiles.
      - name: Build
        run: npm run build
